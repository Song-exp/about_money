<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지도 근거 검토</title>
<style>body{max-width:1000px;margin:30px auto;padding:16px;font:16px sans-serif}input,textarea,select,button{font:inherit;margin:6px;padding:8px}textarea{width:95%;min-height:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin:8px}label{display:block}</style>
<h1>지도 근거 검토</h1><p>원문·상품·지점·기간·모든 적용 조건을 대조한 뒤 승인하세요. 수집 성공은 할인 확인이 아닙니다. evidence_quotes에 각 판단을 뒷받침하는 원문 구절을 입력해야 승인할 수 있습니다.</p>
<p><a href="card-program-review.html">버전형 카드 혜택 승인·재검토</a> · <a href="store-directory-review.html">공식 매장 변경 검토·지도 반영</a></p>
<label>API 주소<input id="base" value="/api"></label><label>관리자 토큰<input id="token" type="password" autocomplete="off"></label>
<button id="load">검토 목록</button><button id="health">수집 상태·알림</button><button id="locations">위치 검토 목록</button>
<p id="status" role="status"></p><ol id="queue"></ol><pre id="details"></pre>
<h2>검토 결정</h2><label>검토 유형<select id="kind"><option>card</option><option>offer</option><option>local</option><option>store</option></select></label><label>항목 ID<input id="item" type="number"></label>
<label>원문 근거<textarea id="source" readonly></textarea></label>
<label>검토 내용 JSON<textarea id="decision"></textarea></label><button id="review">혜택 검토 저장</button><button id="lookup">장소 후보 조회</button><button id="location">위치 검토 저장</button>
<script>
const $=id=>document.getElementById(id);
const evidenceQuotes={product:'',value:'',minimum:'',prior_spend:'',scope:'',period:'',transaction_cap:'',monthly_cap:''};
async function request(path,body){const response=await fetch($('base').value+path,{headers:{'X-Admin-Token':$('token').value,'Content-Type':'application/json'},...(body?{method:'POST',body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
async function run(task){try{$('status').textContent='조회 중…';await task();$('status').textContent='완료'}catch(error){$('status').textContent=error.message}}
$('health').onclick=()=>run(async()=>{$('details').textContent=JSON.stringify(await request('/admin/map/health'),null,2)});
$('load').onclick=()=>run(async()=>{const data=await request('/admin/map/queue');$('queue').replaceChildren();for(const row of data.items){const li=document.createElement('li'),button=document.createElement('button');button.textContent=`${row.kind} ${row.id} · ${row.status} · ${row.label??''}`;button.onclick=()=>run(async()=>{$('kind').value=row.kind;$('item').value=row.id;const evidence=await request(`/admin/map/evidence/${row.kind}/${row.id}`);$('source').value=evidence.source_text;$('details').textContent=JSON.stringify({...evidence,source_text:undefined},null,2);$('decision').value=JSON.stringify({expected_hash:evidence.content_hash,action:'approved',reviewer:'',reason:'',valid_from:null,valid_to:null,indefinite:false,recheck_days:7,rules:{type:'percent',value:0,min_payment:0,prior_spend_required:0,payment_paths:['card'],scope_confirmed:false}},null,2)});li.append(button);$('queue').append(li)}});
$('locations').onclick=()=>run(async()=>{$('details').textContent=JSON.stringify(await request('/admin/map/locations'),null,2)});
$('lookup').onclick=()=>run(async()=>{$('details').textContent=JSON.stringify(await request(`/admin/map/locations/${$('kind').value}/${$('item').value}/candidates`),null,2)});
$('review').onclick=()=>run(async()=>{const body=JSON.parse($('decision').value);if(body.action==='approved'&&!body.evidence_quotes){$('decision').value=JSON.stringify({...body,evidence_quotes:evidenceQuotes},null,2);throw Error('원문에서 각 조건의 근거 구절을 입력한 뒤 저장하세요.')} $('details').textContent=JSON.stringify(await request(`/admin/map/review/${$('kind').value}/${$('item').value}`,body),null,2)});
$('location').onclick=()=>run(async()=>{$('details').textContent=JSON.stringify(await request(`/admin/map/locations/${$('kind').value}/${$('item').value}`,JSON.parse($('decision').value)),null,2)});
</script></html>
